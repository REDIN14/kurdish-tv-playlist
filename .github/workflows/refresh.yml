name: refresh-playlist

# Refreshes the Kurdish TV playlist every 6 hours and publishes it with GitHub Pages:
#   https://<owner>.github.io/<repo>/playlist.m3u
# Enable once: repository Settings -> Pages -> Source: "GitHub Actions". Then run this workflow manually once.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # only to re-enable this workflow (keep-alive step at the end)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04   # pinned: the verified environment (ubuntu-latest moves to a new OS release on 2026-10-19)
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffprobe (measures real stream quality)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install the aggregator
        run: pip install .

      # The data folder holds health history, backoff state, logos and the last known good playlist.
      - name: Restore previous state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: kurdiptv-state-${{ github.run_id }}
          restore-keys: kurdiptv-state-

      - name: Find the public address
        id: pages
        uses: actions/configure-pages@v5

      - name: Refresh (a failed or empty result never replaces the previous playlist)
        env:
          KURDIPTV_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
        run: kurdiptv refresh || echo "refresh finished with exit code $? - the last good playlist is kept"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: kurdiptv-state-${{ github.run_id }}

      - name: Build the static site
        id: site
        # --no-report: the public site carries the playlist and logos only; diagnostics stay in the workflow log
        run: kurdiptv build-static site --base-url "${{ steps.pages.outputs.base_url }}" --no-report

      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outcome == 'success'
        with:
          path: site

      - name: Publish
        id: deploy
        if: steps.site.outcome == 'success'
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows in a repository with no activity for 60 days. Re-enabling the
      # workflow on every run restarts that clock, so the 6-hourly schedule keeps itself alive.
      - name: Keep the schedule alive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable"
