# Known Kurdish channels: canonical name, spelling variants, and how to recognise their streams.
#
# Matching order for every discovered stream (see src/kurdiptv/match.py):
#   1. url_patterns  - substrings of "host/path" that identify the station's own stream servers.
#                      A stream URL is stronger evidence than a (frequently stale) page title.
#   2. name/aliases  - compared after normalisation (case, accents, Arabic/Kurdish script variants,
#                      HD/Live/ZINDI noise words and "(Alt 2)" suffixes are ignored).
# Channels that are not listed here still appear automatically (derived id); this file only improves
# naming, grouping, language/country tags and de-duplication. Add entries freely - no code change needed.
#
# Fields: id (stable tvg-id, never change it), name, aliases, category, language (ckb Sorani | kmr Kurmanji |
#         ku Kurdish), country (ISO-2), url_patterns, logo (optional direct https logo URL).

