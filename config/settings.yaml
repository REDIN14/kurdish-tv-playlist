# Kurdish IPTV aggregator - main settings.
# Everything here has a sensible default; edit only what you need.
# Environment overrides: KURDIPTV_PUBLIC_URL, KURDIPTV_HOST, KURDIPTV_PORT,
# KURDIPTV_DATA_DIR, KURDIPTV_CONFIG_DIR, KURDIPTV_CONTACT, KURDIPTV_ADMIN_TOKEN.

service:
  host: 127.0.0.1                # this PC only. 0.0.0.0 = also phones/TVs on your network (see scripts\install-autostart.ps1 -AllowLan)
  port: 8787
  # Public address of the playlist, used for logo links inside the M3U
  # (e.g. https://example.org/kurdish-tv). Empty = derive from each request.
  public_base_url: ""
  refresh_on_startup: true       # startup refresh never blocks serving the last good playlist
  refresh_interval_hours: 6
  health_interval_minutes: 15
  rate_limit_per_minute: 120     # per client IP, public endpoints

http:
  # Descriptive User-Agent sent to source sites. "contact" (optional) is appended
  # so site owners can reach you - set it to a URL or address you are happy to share.
  user_agent: "KurdishIPTVAggregator/1.0 (personal playlist aggregator; honours robots.txt)"
  contact: ""
  connect_timeout: 8
  read_timeout: 20
  respect_robots: true
  allow_private_hosts: false     # SSRF guard: refuse stream/logo hosts on private networks
  verify_tls: true

probe:
  concurrency: 10                # simultaneous probes overall
  per_host_concurrency: 2        # ... and per stream host
  per_host_min_interval: 0.15    # seconds between requests to one host
  playlist_timeout: 12
  segment_timeout: 20
  max_playlist_bytes: 1000000
  max_segment_bytes: 6000000
  verify_with_ffprobe: true      # measure real resolution/fps/codec when ffprobe is installed
  ffprobe_path: ""               # empty = look on PATH
  ok_ttl_seconds: 900            # a good probe is reused for this long
  backoff_base_seconds: 900      # failed candidates are re-probed after 15 min, 30 min, 1 h ... (cap below)
  backoff_max_seconds: 86400
  fail_threshold: 3              # consecutive failures before a fallback is promoted
  max_variants_tried: 2
  max_fallbacks: 3               # extra URLs kept per channel
  same_host_fallbacks: false     # false: a fallback must live on a different server than the primary
  keep_stale_hours: 72           # keep a previously verified channel this long while all its URLs fail
  stall_seconds: 600             # a live playlist that does not advance for this long counts as frozen

publish:
  keep_snapshots: 3
  min_channels: 5                # never publish fewer channels than this
  min_ratio_of_previous: 0.5     # ... or less than this share of the previous playlist
  fallback_mode: group           # group: backups in a separate group | inline | none
  backup_group: "Backup streams"
  playlist_title: "Kurdish TV"

logos:
  max_bytes: 1000000
  min_px: 48
  max_px: 4096
  output_px: 512
  ttl_days: 7
  use_catalog: true              # iptv-org channel-logo catalog
  catalog_channels_url: https://iptv-org.github.io/api/channels.json
  catalog_logos_url: https://iptv-org.github.io/api/logos.json

# One entry per source. Add another site/playlist here (no code change needed for
# plain M3U playlists: adapter "m3u"). trust "low" = only recognisably Kurdish channels are published.
sources:
  - id: kurdtvs
    adapter: kurdtvs
    url: https://kurdtvs.net/
    trust: high
    min_interval: 1.0
    max_requests: 200
    page_ttl_hours: 12
    options:
      playlist_path: /iptv.php?format=m3u
      follow_channel_pages: true

  - id: kurditv
    adapter: kurditv
    url: https://kurditv.com/
    trust: high
    min_interval: 1.0
    max_requests: 120
    page_ttl_hours: 12
    options:
      # only posts in these categories are Kurdish live channels (others are Arabic/Turkish/German TV)
      include_categories: ["weşana zindî"]

  - id: site123
    adapter: site123
    url: https://semir.site123.me/kurdish-tv-live
    trust: low
    min_interval: 1.0
    max_requests: 200
    page_ttl_hours: 24
    options:
      follow_links: true
      skip_categories: ["sport"]

  # iptv-org: a community-maintained database of publicly available streams (github.com/iptv-org/iptv). Its
  # Kurdish-language list often has current links where the aggregator pages above still show dead ones.
  - id: iptvorg
    adapter: m3u
    url: https://iptv-org.github.io/iptv/languages/kur.m3u
    trust: high
    min_interval: 1.0
    max_requests: 5
    page_ttl_hours: 12

  # iptv-org's Iraq and Syria lists hold a few Kurdish channels that are not tagged "Kurdish" there; take only those.
  - id: iptvorg-iq
    adapter: m3u
    url: https://iptv-org.github.io/iptv/countries/iq.m3u
    trust: high
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12
    options:
      only: [AVA Family, Zagros TV]    # Zagros TV: a 1080p stream next to the 720p one the aggregator pages list

  - id: iptvorg-sy
    adapter: m3u
    url: https://iptv-org.github.io/iptv/countries/sy.m3u
    trust: high
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12
    options:
      only: [Welat TV]

  # The broadcasters' own pages, re-read at every refresh. A stream found here is the channel's ORIGINAL source ("official: true"):
  # it is listed first while it works, ahead of copies on aggregator sites and community lists. The pages also bring a
  # channel back by itself the day its broadcaster repairs or moves its stream (Kirkuk TV, KNN, Kurdmax and Aryen TV
  # point at servers that are offline or refuse outside players today). Sites that block automated access
  # (NRT, Speda, Kurdsat, AVA: bot challenges) or forbid it in robots.txt (Waar) are left out. "only" keeps one
  # channel's address when a page lists many (TRT's page lists a dozen channels).
  - id: official
    adapter: official
    url: https://www.kurdistantv.net/ku/live
    trust: high
    official: true
    min_interval: 1.0
    max_requests: 60
    page_ttl_hours: 12
    options:
      channels:
        - {name: "Kurdistan TV",       pages: ["https://www.kurdistantv.net/ku/live"]}
        - {name: "Rudaw TV",           pages: ["https://rudaw.net/"], only: "rudaw"}
        - {name: "TRT Kurdî",          pages: ["https://trtkurdi.com.tr/"], only: "trtkurdi"}
        - {name: "Payam TV",           pages: ["https://www.peyam.net/live.aspx"]}
        - {name: "Sterk TV",           pages: ["https://sterktv1.net/"]}
        - {name: "Med Muzik",          pages: ["http://medmuzik.tv/"]}
        - {name: "Zarok TV Kurmanci",  pages: ["https://zaroktv.com.tr/"]}
        - {name: "Avar TV",            pages: ["https://avartv.net/"]}
        - {name: "Komala TV",          pages: ["https://tvkomala.com/"]}
        - {name: "Ilke TV",            pages: ["https://www.ilketv.com.tr/"]}
        - {name: "Sercem TV",          pages: ["https://sercemtv.com.tr/"]}
        - {name: "Kirkuk TV",          pages: ["https://kirkuktv.net/KU/Live"]}
        - {name: "KNN",                pages: ["https://www.knnc.net/live1.aspx"]}
        # Kurdmax: the live pages of the family. Today their streams refuse outside players (Sorani, Kurmanji: HTTP 403), or
        # their servers are down (Show: Cloudflare 522, Music: connection refused); each appears by itself once one works.
        - {name: "Kurdmax Sorani",     pages: ["https://kurdmax.tv/live-stream"]}
        - {name: "Kurdmax Kurmanci",   pages: ["https://kurdmax.tv/live-stream?lang=ku"]}
        - {name: "Kurdmax Show",       pages: ["https://www.kurdmaxshow.tv/live-stream"]}
        - {name: "Kurdmax Show Kurmanci", pages: ["https://www.kurdmaxshow.tv/live-stream?lang=ku"]}
        - {name: "Kurdmax Music",      pages: ["https://www.kurdmaxmusic.tv/live-stream"]}
        - {name: "Gali Kurdistan TV",  pages: ["https://www.gksat.tv/"]}
        - {name: "Gali Kurdistan Plus", pages: ["https://www.gksat.tv/KU/Liveplus"]}
        - {name: "Aryen TV",           pages: ["https://aryen.tv/"]}
        - {name: "Welat TV",           pages: ["https://www.welattv.net/live-page"]}
        - {name: "4 Kurd",             pages: ["https://4kurd.persiana.live/"]}

  # Community-maintained Kurdish lists on GitHub (somebody's M3U). They are the best place to find current addresses of small
  # channels the aggregator pages list with dead links, but their labels are unreliable and they mix in world sports, pay-TV
  # and cartoons. "catalog_only": a list can add streams to a channel that is in catalog.yaml (or that another source
  # already lists), it can never introduce a channel itself and it never counts as corroboration. Dead links in them are
  # simply never published (every stream is probed). Chosen because together they carry the working addresses of the channels
  # added to catalog.yaml from them; a list that disappears only costs its backups.
  - id: list-zheer88
    adapter: m3u
    url: https://raw.githubusercontent.com/Zheer88/Kurdish-TV/main/playlist.m3u
    trust: low
    catalog_only: true
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12

  - id: list-hersh
    adapter: m3u
    url: https://raw.githubusercontent.com/hershsaeed/Hersh/main/KURD%20%2B.txt
    trust: low
    catalog_only: true
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12

  - id: list-bashdar
    adapter: m3u
    url: https://raw.githubusercontent.com/Bashdarsarbaz/Kurdish-TV/main/Bashdar.m3u
    trust: low
    catalog_only: true
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12

  - id: list-qsnoramedi
    adapter: m3u
    url: https://raw.githubusercontent.com/qsnoramedi5-commits/kurdishtv_channels/main/kurdishtv_channels.m3u
    trust: low
    catalog_only: true
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12

  - id: list-6ebeng
    adapter: m3u
    url: https://raw.githubusercontent.com/6ebeng/Kurdish-Playlist-IPTV-M3U/main/Chennels.m3u
    trust: low
    catalog_only: true
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12

  # Two more, found by searching GitHub again on 2026-10-15; each is the only list carrying a working address for at least
  # one catalogued channel (NRT and ONE Plus / ONE Kids; Peshmerga TV). Reseller-panel entries in them are rejected as usual.
  - id: list-mhamad
    adapter: m3u
    url: https://raw.githubusercontent.com/mhamadrebwar3600-dev/IPTV-Kurdi/main/playlist.m3u
    trust: low
    catalog_only: true
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12

  - id: list-andam
    adapter: m3u
    url: https://raw.githubusercontent.com/AndamAziz/Andamiptv/main/andam-playlist.m3u
    trust: low
    catalog_only: true
    min_interval: 1.0
    max_requests: 3
    page_ttl_hours: 12

  # karwan.tv sits behind a Cloudflare bot challenge. The adapter makes one honest request and
  # reports "blocked" - it never tries to get around the challenge. It starts working by itself
  # if the site owner allows this aggregator.
  - id: karwan
    adapter: html_scan
    url: https://karwan.tv/
    trust: low
    min_interval: 2.0
    max_requests: 20
    page_ttl_hours: 12
