[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kurdiptv"
version = "1.0.0"
description = "Kurdish IPTV playlist aggregator: discovers, probes, ranks and publishes one M3U playlist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "Pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kurdiptv = "kurdiptv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
filterwarnings = ["ignore::DeprecationWarning"]
